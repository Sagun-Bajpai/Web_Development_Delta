<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="Forms.css"/>
    <link href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
</head>
<body>
    <div class ="container">
        <h2>Form Demo</h2>
        <form >
           <div class="row">

        
                <div class="mb-3 col-md-6">
                <lebel  class="form-label">Email</lebel>
            <input type="text"  class="form-control" placeholder="Email" id="email">
            </div>
            <div class="mb-3 col">
                  <lebel class="form-label" >Password</lebel>
             <input type="text" class="form-control" placeholder="Password" id="Password" >
            </div>
<!--select-->
            <div class="mb-3 col-mid-6">
                <lebel  class="form-label">Address</lebel>
                <select class="form-select">
                    <option selected>Choose your city</option>
                    <option vlaue="1">Mumbai</option>
                     <option vlaue="2">Delhi</option>
                      <option vlaue="3">Pune</option>
                      <option vlaue="3">Kanpur</option>

                </select>

            </div>

            </div>
            
<!--checkbox using boostrap and normal-->
            <div class="mb-3 form-check">
                <label  class="form-check-label" for="agreebs">Agree</label>
                <input   class="form-check-input" type="checkbox" id="agreebs">
            </div>
           
            <div class="mb-3 normal">
                <label   for="agree">Agree</label>
                <input   type="checkbox" id="agree">
            </div>

<!--switches-->
            <div class="mb-3 form-check">
                <label  class="form-check-label" for="radiobs">Yes/No</label>
                <input   class="form-check-input" type="radio" id="radiobs">
            </div>
<!--switch box-->
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch </label>
            </div>
           
            
           
        </form>
    </div>
</body>
</html>
